[project]
name = "adam"
version = "0.1.0"
description = "Local AI research and decision-support platform"
authors = [
    { name = "Abid Ali Awan", email = "36753484+kingabzpro@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
adam = "adam:main"
adam-setup = "adam.setup:main"
adam-benchmark = "adam.benchmark:main"
adam-calibrate = "adam.calibration:main"
adam-outcomes = "adam.evaluation:main"
adam-paper = "adam.paper:main"

[project.optional-dependencies]
forecast = [
    "timestral",
]
sentiment = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }

